name: Normalize initial source
on:
  push:
    paths: [.github/workflows/format-setup.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Format the new source
        run: |
          pnpm exec prettier --write src astro.config.ts astro-paper.config.ts package.json README.md docs scripts/browser-check.cjs .prettierrc
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src astro.config.ts astro-paper.config.ts package.json README.md docs scripts/browser-check.cjs .prettierrc
          git commit -m "style: format the bilingual site and design tokens"
          git push origin HEAD:main
